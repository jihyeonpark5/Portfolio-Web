<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션</title>
    <link rel="icon" href="favicon (2).ico" type="image/x-icon">
    <link rel="stylesheet" href="animation_style.css">
</head>
<body>
    <h1>Have a Good Day!!</h1>

    <section>
        <article class="sky">
            <img src="animation_img/sun.png" class="sun">
            <img src="animation_img/cloud1.png" class="cloud1">
            <img src="animation_img/cloud2.png" class="cloud2">
        </article>

        <article class="town">
            <img src="animation_img/circle.png" class="circle">
            <img src="animation_img/town_night.png" class="night">
            <img src="animation_img/town_day.png" class="day">
        </article>

        <article class="people">
            <img src="animation_img/man.png" class="man">
            <img src="animation_img/family.png" class="family">
        </article>
    </section>
</body>
</html>
